<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1b3a">
<title>포켓몬 강화하기 — 검강화 스타일</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #2b2e6b 0%, #1a1b3a 45%, #0e0f24 100%);
    color:#fff;min-height:100dvh;display:flex;justify-content:center;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  #app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    gap:10px}
  /* 상단바 */
  .topbar{display:flex;gap:8px;align-items:stretch}
  .pill{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:8px 10px;text-align:center;backdrop-filter:blur(6px)}
  .pill small{display:block;font-size:11px;color:#ffd76a;letter-spacing:1px;font-weight:700}
  .pill b{font-size:17px;font-variant-numeric:tabular-nums}
  #best-pill b{color:#7dffb2}
  /* 몬스터 카드 */
  .card{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:14px 12px 12px;
    text-align:center;position:relative;overflow:hidden}
  .rank-badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1px;
    padding:4px 10px;border-radius:999px;margin-bottom:6px;border:1px solid}
  .lv{font-size:clamp(22px,6vw,28px);font-weight:900;letter-spacing:.5px}
  .lv small{font-size:14px;color:#ffd76a}
  .mon-name{font-size:15px;color:#dfe3ff;margin-top:2px}
  .cp{font-size:13px;color:#9ef0ff;margin-top:2px;font-variant-numeric:tabular-nums}
  .stage{position:relative;height:172px;display:flex;align-items:center;justify-content:center;margin:4px 0}
  #mon{font-size:104px;line-height:1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));
    transition:transform .15s;transform-origin:center}
  #mon.boost{transform:scale(1.12)}
  .aura{position:absolute;width:190px;height:190px;border-radius:50%;filter:blur(2px);
    opacity:.55;pointer-events:none;transition:all .3s}
  .stars{position:absolute;top:8px;right:10px;font-size:15px;letter-spacing:2px}
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translate(-9px,3px) rotate(-4deg)}
    40%{transform:translate(8px,-4px) rotate(4deg)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
  .jump{animation:jump .5s}
  @keyframes jump{0%{transform:scale(1)}30%{transform:scale(1.25) translateY(-14px)}60%{transform:scale(.95)}100%{transform:scale(1)}}
  .break-anim{animation:brk .6s}
  @keyframes brk{0%{transform:scale(1);filter:grayscale(0)}50%{transform:scale(1.2) rotate(8deg);filter:grayscale(1) brightness(.4)}100%{transform:scale(.6);opacity:.4}}
  /* 확률바 */
  .prob-row{display:flex;justify-content:space-between;font-size:13px;color:#cdd3ff;margin:6px 2px 4px}
  .prob-row b{color:#fff}
  .bar{height:10px;background:rgba(0,0,0,.45);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
  #prob-fill{height:100%;width:50%;border-radius:999px;background:linear-gradient(90deg,#37e05c,#d4ff4f);
    transition:width .25s}
  .sub-info{display:flex;gap:8px;margin-top:8px}
  .sub-info div{flex:1;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.1);
    border-radius:12px;padding:7px 4px;font-size:12px;line-height:1.5}
  .sub-info b{display:block;font-size:14px;color:#ffe27a;font-variant-numeric:tabular-nums}
  /* 버튼 */
  #enhance-btn{
    width:100%;min-height:68px;border:none;border-radius:18px;font-size:20px;font-weight:900;letter-spacing:1px;
    color:#3a2200;background:linear-gradient(180deg,#ffe45e,#ffb300);
    box-shadow:0 6px 0 #a86a00,0 10px 24px rgba(255,180,0,.35);cursor:pointer;
    touch-action:manipulation;
  }
  #enhance-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a86a00}
  #enhance-btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;box-shadow:0 6px 0 #555}
  .btn-row{display:flex;gap:8px}
  .btn-row button{
    flex:1;min-height:56px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
    font-size:15px;font-weight:800;color:#fff;background:rgba(255,255,255,.1);cursor:pointer;
    touch-action:manipulation;padding:8px 4px;line-height:1.3;
  }
  .btn-row button:active{transform:scale(.97);background:rgba(255,255,255,.18)}
  .btn-row button small{display:block;font-size:11px;font-weight:600;opacity:.85}
  #hunt-btn{background:linear-gradient(180deg,#3ddc84,#0e9f5b);border:none;color:#062b1a}
  #sell-btn{background:linear-gradient(180deg,#6aa8ff,#2b5bd7);border:none}
  .util-row{display:flex;gap:8px}
  .util-row button{flex:1;min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.3);color:#dfe3ff;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .util-row button.on{background:#7c5cff;color:#fff;border-color:#7c5cff}
  .util-row button:active{transform:scale(.97)}
  /* 스탯 + 로그 */
  .stats{display:flex;gap:6px;font-size:11px;color:#aab1e6;text-align:center}
  .stats div{flex:1;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 2px}
  .stats b{display:block;color:#fff;font-size:13px}
  #log{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:14px;
    padding:8px 10px;min-height:96px;max-height:150px;overflow:hidden;font-size:13px;line-height:1.7}
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ok{color:#5dff8a}.fail{color:#ff7b7b}.dest{color:#ff3b3b;font-weight:900}.gold{color:#ffd76a}.info{color:#9ef0ff}
  /* 결과 토스트 */
  #toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);z-index:50;
    font-size:clamp(30px,9vw,52px);font-weight:900;opacity:0;pointer-events:none;
    text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 30px currentColor;transition:all .18s;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  #flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:#fff;transition:opacity .25s}
  .float{position:fixed;z-index:60;font-weight:900;font-size:20px;pointer-events:none;
    animation:floatup 1s forwards;text-shadow:0 2px 0 #000}
  @keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}
  .confetti{position:fixed;top:30%;z-index:60;width:9px;height:14px;pointer-events:none;animation:fall 1.1s forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(220px) rotate(540deg)}}
  /* 모달 */
  #modal{position:fixed;inset:0;z-index:70;background:rgba(5,6,20,.75);display:none;
    align-items:center;justify-content:center;padding:18px}
  #modal.open{display:flex}
  .sheet{width:100%;max-width:440px;background:#22244d;border:1px solid rgba(255,255,255,.2);
    border-radius:20px;padding:16px;max-height:84dvh;overflow:auto}
  .sheet h2{font-size:17px;margin-bottom:4px}
  .sheet p{font-size:12px;color:#aab1e6;margin-bottom:10px;line-height:1.6}
  .mon-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mon-grid button{background:rgba(255,255,255,.07);border:2px solid transparent;border-radius:14px;
    padding:10px 6px;color:#fff;cursor:pointer;touch-action:manipulation}
  .mon-grid button.sel{border-color:#ffd76a;background:rgba(255,215,106,.12)}
  .mon-grid .e{font-size:40px}
  .mon-grid b{display:block;font-size:14px;margin-top:2px}
  .mon-grid small{font-size:11px;color:#aab1e6;line-height:1.4;display:block}
  #close-modal{width:100%;margin-top:10px;min-height:48px;border-radius:12px;border:none;
    background:#ffd76a;font-weight:900;font-size:15px;cursor:pointer}
  footer{font-size:11px;color:#7c83b8;text-align:center;line-height:1.6}
  @media (min-width:520px){ #mon{font-size:120px} .stage{height:190px} }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="pill"><small>💰 보유 골드</small><b id="money">0</b></div>
    <div class="pill" id="best-pill"><small>🏆 최고 강화</small><b id="best">+0</b></div>
  </div>

  <div class="card">
    <span class="rank-badge" id="rank">노말</span>
    <div class="lv"><span id="lv">+0</span> <small id="pity"></small></div>
    <div class="mon-name" id="mon-name">피카츄</div>
    <div class="cp" id="cp">CP 120</div>
    <div class="stage">
      <div class="aura" id="aura"></div>
      <div id="mon">🐹</div>
      <div class="stars" id="stars"></div>
    </div>
    <div class="prob-row"><span>성공 확률 <b id="prob-txt">100%</b></span><span>파괴 확률 <b id="dest-txt">0%</b></span></div>
    <div class="bar"><div id="prob-fill"></div></div>
    <div class="sub-info">
      <div>강화 비용<b id="cost">100G</b></div>
      <div>판매 가격<b id="sell">200G</b></div>
      <div>사냥 보상<b id="hunt-prev">~150G</b></div>
    </div>
  </div>

  <button id="enhance-btn">🔨 강화하기</button>

  <div class="btn-row">
    <button id="hunt-btn">⚔️ 사냥하기<small id="hunt-sub">+150G · 터치!</small></button>
    <button id="sell-btn">💸 판매하기<small id="sell-sub">+200G</small></button>
  </div>

  <div class="util-row">
    <button id="auto-btn">🤖 자동강화 OFF</button>
    <button id="dex-btn">📖 포켓몬 변경</button>
    <button id="reset-btn">↻ 초기화</button>
  </div>

  <div class="stats">
    <div>시도<b id="st-try">0</b></div>
    <div>성공<b id="st-ok">0</b></div>
    <div>실패<b id="st-fail">0</b></div>
    <div>파괴<b id="st-dest">0</b></div>
    <div>누적골드<b id="st-gold">0</b></div>
  </div>

  <div id="log"></div>
  <footer>검강화 스타일 룰 · 실패하면 하락 / 고강에서 파괴(0강) · 자동저장<br>Space=강화 · H=사냥 · S=판매 · 모바일 진동·사운드 지원</footer>
</div>

<div id="toast"></div>
<div id="flash"></div>

<div id="modal">
  <div class="sheet">
    <h2>📖 포켓몬 선택 (판매 후 0강부터)</h2>
    <p>바꾸면 현재 강화는 <b style="color:#ff8a8a">0강으로 리셋</b>돼요. 대신 보유 골드는 유지!<br>뮤츠는 어렵지만 판매가가 2배, 이상해씨는 안정형.</p>
    <div class="mon-grid" id="mon-grid"></div>
    <button id="close-modal">닫기</button>
  </div>
</div>

<script>
'use strict';
/* ===== 데이터 ===== */
const SUCCESS = [100,95,90,85,80,75,70,65,60,55,50,45,40,35,30,28,25,22,20,18,15,13,11,9,7,5,4,3,2,1]; // lv -> lv+1, lv30 MAX
const MAX_LV = 30;
const MONS = [
  {id:'pika', name:'피카츄', emoji:'🐹', base:120, costMul:1.0, bonus:0,  sellMul:1.0, desc:'밸런스 · 기본'},
  {id:'eve',  name:'이브이', emoji:'🦊', base:100, costMul:0.85,bonus:0,  sellMul:1.1, desc:'초보추천 · 저렴'},
  {id:'pari', name:'파이리', emoji:'🦎', base:110, costMul:0.9, bonus:-3, sellMul:1.2, desc:'공격 · 판매↑ 확률↓'},
  {id:'kko',  name:'꼬부기', emoji:'🐢', base:130, costMul:1.1, bonus:5,  sellMul:1.0, desc:'방어 · 확률+5%'},
  {id:'iss',  name:'이상해씨',emoji:'🐸',base:125, costMul:1.2, bonus:8,  sellMul:0.9, desc:'안정 · 확률+8%'},
  {id:'mew',  name:'뮤츠',   emoji:'👾', base:300, costMul:1.5, bonus:-10,sellMul:2.0, desc:'도박 · 판매 2배 확률↓'},
];
function rankOf(lv){
  if(lv>=30) return {n:'👑 아르세우스급', c:'#ff1744', bg:'linear-gradient(90deg,#ff1744,#ffea00,#00e676,#00b0ff,#d500f9)'};
  if(lv>=25) return {n:'챔피언', c:'#ff5252', bg:'rgba(255,82,82,.18)'};
  if(lv>=20) return {n:'하이퍼', c:'#ff9800', bg:'rgba(255,152,0,.18)'};
  if(lv>=15) return {n:'마스터', c:'#e040fb', bg:'rgba(224,64,251,.16)'};
  if(lv>=10) return {n:'울트라', c:'#448aff', bg:'rgba(68,138,255,.16)'};
  if(lv>=5)  return {n:'그레이트', c:'#69f0ae', bg:'rgba(105,240,174,.12)'};
  return {n:'노말', c:'#b0bec5', bg:'rgba(176,190,197,.12)'};
}
function auraColor(lv){
  if(lv>=30) return 'conic-gradient(#ff1744,#ffea00,#00e676,#00b0ff,#d500f9,#ff1744)';
  if(lv>=25) return 'radial-gradient(circle,#ff525255 0%,transparent 70%)';
  if(lv>=20) return 'radial-gradient(circle,#ff980055 0%,transparent 70%)';
  if(lv>=15) return 'radial-gradient(circle,#e040fb55 0%,transparent 70%)';
  if(lv>=10) return 'radial-gradient(circle,#448aff55 0%,transparent 70%)';
  if(lv>=5)  return 'radial-gradient(circle,#69f0ae44 0%,transparent 70%)';
  return 'radial-gradient(circle,#ffffff22 0%,transparent 70%)';
}
const costOf  = (lv,m)=> Math.floor((100 + lv*120) * Math.pow(1.32, lv) * m.costMul);
const sellOf  = (lv,m)=> lv<=0 ? 50 : Math.floor((200*Math.pow(1.55,lv) + lv*200) * m.sellMul);
const cpOf    = (lv,m)=> Math.floor(m.base * Math.pow(1.55, lv) + lv*15);
const probOf  = (lv,m,pity)=> lv>=MAX_LV?0:Math.max(1,Math.min(100, SUCCESS[lv]+m.bonus+pity));
function destroyProb(lv){ // 실패 시 파괴(0강) 확률
  if(lv<=15) return 0;
  const t={16:2,17:3,18:4,19:5,20:6,21:8,22:10,23:13,24:16,25:18,26:20,27:22,28:25,29:30};
  return t[lv]||0;
}
function dropOf(lv){
  if(lv<=5) return 0;
  if(lv<=10) return 1;
  if(lv<=15) return 2;
  return 3;
}
const fmt = n => Math.floor(n).toLocaleString('ko-KR');

/* ===== 상태 ===== */
let S = {money:2000, level:0, monId:'pika', best:0, pity:0, try:0, ok:0, fail:0, dest:0, earned:0};
try{
  const raw = localStorage.getItem('pokemon-enhance-save');
  if(raw){ const p=JSON.parse(raw); S = Object.assign(S,p); }
}catch(e){}
let auto=false, autoTimer=null, busy=false, huntCD=false;
const mon = ()=> MONS.find(m=>m.id===S.monId) || MONS[0];

/* ===== 오디오 ===== */
let AC=null;
function ac(){ try{
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}catch(e){ return null; } }
function tone(f,d,type,v,slide,delay){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+d);
  g.gain.setValueAtTime(v||.18,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+d+.02);
}
const sfx={
  click(){ tone(600,.06,'square',.12); },
  enhance(){ tone(200,.25,'sawtooth',.15,600); tone(900,.12,'square',.1,1400,.15); },
  success(lv){ const b=[523,659,784,1046]; b.forEach((f,i)=>tone(f,.16,'triangle',.2,null,i*.07));
    if(lv>=15) tone(1318,.3,'triangle',.22,null,.3); if(lv>=25) tone(1568,.4,'sine',.22,null,.45); },
  fail(){ tone(300,.25,'sawtooth',.2,110); tone(150,.3,'square',.15,70,.1); },
  destroy(){ tone(400,.6,'sawtooth',.25,40); tone(90,.7,'square',.2,30,.1); },
  sell(){ [660,880,1320].forEach((f,i)=>tone(f,.12,'square',.16,null,i*.06)); },
  hunt(){ tone(500+Math.random()*400,.09,'triangle',.16,900); },
  max(){ [1046,1318,1568,2093].forEach((f,i)=>tone(f,.2,'triangle',.2,null,i*.09)); },
};
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ===== 헬퍼 UI ===== */
const $ = id => document.getElementById(id);
function toast(txt,color){
  const t=$('toast'); t.textContent=txt; t.style.color=color||'#fff';
  t.classList.add('show'); clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),900);
}
function flash(color,op){
  const f=$('flash'); f.style.background=color||'#fff'; f.style.opacity=op||.7;
  clearTimeout(f._t); f._t=setTimeout(()=>f.style.opacity=0,180);
}
function floatTxt(txt,color,x){
  const d=document.createElement('div'); d.className='float'; d.textContent=txt;
  d.style.color=color||'#fff'; d.style.left=(x||innerWidth/2-40)+'px'; d.style.top='42%';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1000);
}
function confetti(n){
  const cols=['#ffd76a','#ff5252','#69f0ae','#448aff','#e040fb','#fff'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.background=cols[i%cols.length];
    d.style.left=(10+Math.random()*80)+'vw'; d.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),1150);
  }
}
function log(msg,cls){
  const L=$('log'); const d=document.createElement('div'); if(cls)d.className=cls; d.innerHTML=msg;
  L.prepend(d); while(L.children.length>30) L.lastChild.remove();
}
function save(){ try{ localStorage.setItem('pokemon-enhance-save', JSON.stringify(S)); }catch(e){} }

/* ===== 렌더 ===== */
function render(){
  const m=mon(), lv=S.level;
  const pityBonus=Math.min(10,S.pity*2);
  const p=probOf(lv,m,pityBonus), dp=destroyProb(lv);
  const cost=costOf(lv,m), sell=sellOf(lv,m);
  const huntAvg=Math.floor(80+lv*25+(50+lv*10)/2);
  const r=rankOf(lv);

  $('money').textContent=fmt(S.money)+'G';
  $('best').textContent='+'+S.best;
  $('lv').textContent='+'+lv;
  $('pity').textContent=(S.pity>=2&&lv<MAX_LV)?`(자비 +${pityBonus}%)`:'';
  $('mon-name').textContent=m.name+(lv>=30?' · MAX':'');
  $('cp').textContent='CP '+fmt(cpOf(lv,m))+' · '+m.name+'('+(m.desc)+')';
  $('mon').textContent=m.emoji;
  $('mon').style.fontSize=(lv>=20?'124px':lv>=10?'114px':'104px');
  const rb=$('rank'); rb.textContent=(lv>=30?'👑 ':'')+r.n+' · +'+lv;
  rb.style.color=r.c; rb.style.borderColor=r.c; rb.style.background=r.bg;
  $('aura').style.background=auraColor(lv);
  $('aura').style.transform=`scale(${1+lv*0.02})`;
  $('stars').textContent='⭐'.repeat(Math.min(5,Math.floor(lv/5)))+(lv>=30?'🌈':'');
  $('prob-txt').textContent=lv>=MAX_LV?'MAX':p+'%';
  $('dest-txt').textContent=lv>=MAX_LV?'-':dp+'%';
  $('dest-txt').style.color=dp>0?'#ff8a8a':'#fff';
  const fill=$('prob-fill'); fill.style.width=(lv>=MAX_LV?100:p)+'%';
  fill.style.background=p>=60?'linear-gradient(90deg,#37e05c,#d4ff4f)':p>=30?'linear-gradient(90deg,#ffb300,#ffe45e)':'linear-gradient(90deg,#ff5252,#ff9800)';
  $('cost').textContent=lv>=MAX_LV?'—':fmt(cost)+'G';
  $('sell').textContent=fmt(sell)+'G';
  $('sell-sub').textContent='+'+fmt(sell)+'G';
  $('hunt-prev').textContent='~'+fmt(huntAvg)+'G';
  $('hunt-sub').textContent='+'+fmt(Math.floor(80+lv*25))+'G~ · 터치!';
  const btn=$('enhance-btn');
  if(lv>=MAX_LV){ btn.textContent='👑 MAX 달성! 판매하고 새로 시작'; btn.disabled=false; }
  else{ btn.textContent=`🔨 강화하기 (${fmt(cost)}G · ${p}%)`; btn.disabled=S.money<cost; }
  $('st-try').textContent=S.try; $('st-ok').textContent=S.ok; $('st-fail').textContent=S.fail;
  $('st-dest').textContent=S.dest; $('st-gold').textContent=fmt(S.earned)+'G';
  save();
}

/* ===== 핵심 로직 ===== */
function doEnhance(){
  const m=mon(), lv=S.level;
  if(busy) return;
  if(lv>=MAX_LV){ sfx.max(); toast('👑 이미 MAX!', '#ffd76a'); return; }
  const cost=costOf(lv,m);
  if(S.money<cost){ toast('💰 골드 부족!', '#ff8a8a'); log('골드 부족 — <span class="gold">사냥(H)</span>이나 판매를 하세요','fail'); buzz(40); return; }
  busy=true; ac(); sfx.enhance();
  const stage=$('mon'); stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  // 0.45초 연출 후 판정 (검강화 특유의 두근거림)
  setTimeout(()=>{
    S.money-=cost; S.try++;
    const pityBonus=Math.min(10,S.pity*2);
    const p=probOf(lv,m,pityBonus);
    const roll=Math.random()*100;
    const el=$('mon');
    if(roll<p){
      S.level=Math.min(MAX_LV,lv+1); S.ok++; S.pity=0;
      if(S.level>S.best) S.best=S.level;
      el.classList.remove('jump'); void el.offsetWidth; el.classList.add('jump','boost');
      setTimeout(()=>el.classList.remove('boost'),300);
      flash(S.level>=20?'#ffd76a':'#ffffff', S.level>=20?.55:.35);
      sfx.success(S.level); buzz([30,40,30]);
      toast(S.level>=30?'👑 MAX!!!':`성공! +${S.level}`,'#5dff8a');
      floatTxt(`+${S.level} 성공!`,'#5dff8a');
      log(`<span class="ok">✔ +${lv} → +${S.level} 성공</span> <span class="gold">(-${fmt(cost)}G)</span>`, 'ok');
      if(S.level>=10) confetti(Math.min(40,8+S.level));
      if(S.level===30){ sfx.max(); confetti(60); log('👑 <b>아르세우스급 달성!</b> 전설이다!','gold'); }
    }else{
      const dp=destroyProb(lv);
      const droll=Math.random()*100;
      if(droll<dp){
        S.level=0; S.fail++; S.dest++; S.pity=0;
        el.classList.remove('break-anim'); void el.offsetWidth; el.classList.add('break-anim');
        flash('#ff0000',.55); sfx.destroy(); buzz([100,60,120]);
        toast('💥 파괴... 0강', '#ff3b3b');
        floatTxt('파괴됨...','#ff3b3b');
        log(`<span class="dest">💥 +${lv} 파괴 → +0</span> (파괴 ${dp}%)`, 'dest');
      }else{
        const drop=dropOf(lv);
        S.level=Math.max(0,lv-drop); S.fail++; S.pity++;
        flash('#331111',.4); sfx.fail(); buzz(60);
        toast(drop===0?'실패 (유지)':`실패 -${drop}`, '#ff7b7b');
        floatTxt(drop===0?'유지!':`-${drop}...`, '#ff7b7b');
        log(`<span class="fail">✖ +${lv} 실패 → +${S.level}</span>${drop?` (-${drop})`:''} <span class="gold">(-${fmt(cost)}G)</span>`, 'fail');
      }
    }
    busy=false; render();
  },380);
}
function doHunt(){
  if(huntCD) return; huntCD=true; setTimeout(()=>huntCD=false,700);
  ac();
  const lv=S.level;
  const base=80+lv*25+Math.random()*(50+lv*10);
  const crit=Math.random()<0.1;
  const gain=Math.floor(base*(crit?3:1));
  S.money+=gain; S.earned+=gain; sfx.hunt(); buzz(crit?50:15);
  floatTxt((crit?'✨대박 +':' +')+fmt(gain)+'G', crit?'#ffe45e':'#9ef0ff');
  if(crit) log(`⚔️ 사냥 <b>대박!</b> <span class="gold">+${fmt(gain)}G</span>`,'gold');
  render();
}
function doSell(){
  const m=mon(), lv=S.level;
  if(lv<=0){ toast('판매할 강화가 없어요', '#9ef0ff'); sfx.click(); return; }
  ac();
  const price=sellOf(lv,m);
  S.money+=price; S.earned+=price;
  log(`💸 ${m.name} +${lv} 판매 <span class="gold">+${fmt(price)}G</span> → +0`, 'info');
  S.level=0; S.pity=0; sfx.sell(); buzz(30);
  toast(`+${fmt(price)}G!`, '#ffd76a'); flash('#448aff',.3);
  render();
}

/* ===== 이벤트 ===== */
$('enhance-btn').addEventListener('click',doEnhance);
$('enhance-btn').addEventListener('touchstart',e=>{e.preventDefault();doEnhance();},{passive:false});
$('hunt-btn').addEventListener('click',doHunt);
$('hunt-btn').addEventListener('touchstart',e=>{e.preventDefault();doHunt();},{passive:false});
$('sell-btn').addEventListener('click',doSell);
$('auto-btn').addEventListener('click',()=>{
  auto=!auto; ac(); sfx.click();
  $('auto-btn').textContent=auto?'🤖 자동강화 ON':'🤖 자동강화 OFF';
  $('auto-btn').classList.toggle('on',auto);
  if(auto){ autoTimer=setInterval(()=>{
      if(!auto) return;
      const m=mon();
      if(S.level>=MAX_LV){ setAuto(false); toast('MAX 달성!', '#ffd76a'); return; }
      if(S.money<costOf(S.level,m)){ setAuto(false); log('자동강화 중지 — 골드 부족','fail'); return; }
      if(!busy) doEnhance();
    },1000);
    log('🤖 자동강화 시작 (1초 간격)','info');
  }else{ clearInterval(autoTimer); log('🤖 자동강화 중지','info'); }
});
function setAuto(v){ auto=v; clearInterval(autoTimer);
  $('auto-btn').textContent=auto?'🤖 자동강화 ON':'🤖 자동강화 OFF';
  $('auto-btn').classList.toggle('on',auto); }
$('reset-btn').addEventListener('click',()=>{
  if(!confirm('정말 초기화할까요? (골드·강화·기록 전부 리셋)')) return;
  S={money:2000,level:0,monId:'pika',best:0,pity:0,try:0,ok:0,fail:0,dest:0,earned:0};
  setAuto(false); save(); render(); $('log').innerHTML='';
  log('↻ 초기화 — 2000G 지급!','info'); toast('초기화!', '#fff');
});
$('dex-btn').addEventListener('click',()=>{ sfx.click(); buildDex(); $('modal').classList.add('open'); });
$('close-modal').addEventListener('click',()=>$('modal').classList.remove('open'));
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') e.target.classList.remove('open'); });
function buildDex(){
  const g=$('mon-grid'); g.innerHTML='';
  MONS.forEach(m=>{
    const b=document.createElement('button');
    if(m.id===S.monId) b.className='sel';
    b.innerHTML=`<div class="e">${m.emoji}</div><b>${m.name}</b><small>${m.desc}<br>비용×${m.costMul} · 성공${m.bonus>=0?'+':''}${m.bonus}% · 판매×${m.sellMul}</small>`;
    b.onclick=()=>{
      if(m.id!==S.monId){
        S.monId=m.id; S.level=0; S.pity=0; setAuto(false);
        log(`📖 ${m.name} 선택! +0부터 시작`,'info'); toast(m.name+'!', '#9ef0ff'); sfx.sell();
      }
      $('modal').classList.remove('open'); render();
    };
    g.appendChild(b);
  });
}
window.addEventListener('keydown',e=>{
  if($('modal').classList.contains('open')){ if(e.key==='Escape') $('modal').classList.remove('open'); return; }
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); doEnhance(); }
  else if(e.code==='KeyH') doHunt();
  else if(e.code==='KeyS') doSell();
});
// 첫 터치에 오디오 해제 (모바일 정책)
window.addEventListener('pointerdown',()=>ac(),{once:true});

/* ===== 부트 ===== */
log('🎮 <b>포켓몬 강화하기</b> 시작! 검강화 룰 그대로','gold');
log('🔨 강화 비용↑ 확률↓ · 실패 하락 · 16강부터 파괴 주의','info');
log('⚔️ 골드 부족하면 <b>사냥</b>을 눌러 벌자 (0.7초마다 가능)','info');
render();
</script>
